<title>Post maker mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wght@200;300;400;600&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: square-icon rail on the left; main column opens with a giant lowercase pivot header, then today's tiles beside the open post. */
:root {
  --ground: #000000; --ink: #ffffff; --ink-2: #b9b9b9; --ink-3: #8a8a8a; --line: #2a2a2a; --raise: #111111;
  --cyan: #00bde3; --magenta: #e6007e; --lime: #a4e600; --orange: #f09609; --purple: #a259ff;
  --live: var(--cyan);
  --ui: "Noto Sans Display", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ground); color: var(--ink); }
body { font: 300 15px/1.5 var(--ui); }
::selection { background: var(--cyan); color: #000; }
* { scrollbar-color: #333 #000; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

/* Rail */
.rail { padding-block: 26px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: 20px; display: flex; flex-direction: column; gap: 26px; position: sticky; top: 0; height: 100vh; }
.mark { font: 300 30px/1 var(--ui); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; text-decoration: none; }
.mark i { width: 18px; height: 18px; background: radial-gradient(circle, var(--ink) 1.2px, transparent 1.6px) 0 0/6px 6px; display: inline-block; }
.nav { display: grid; gap: 8px; }
.nav a { display: flex; align-items: center; gap: 16px; text-decoration: none; font-size: 17px; color: var(--ink-2); }
.nav a .sq { width: 52px; height: 52px; border: 1.5px solid #4a4a4a; display: grid; place-items: center; flex: none; transition: background .15s, border-color .15s; }
.nav a:hover { color: var(--ink); } .nav a:hover .sq { border-color: var(--ink); }
.nav a[aria-current="page"] { color: var(--live); }
.nav a[aria-current="page"] .sq { background: var(--live); border-color: var(--live); color: #000; }
.nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: square; }
.group { display: grid; gap: 8px; border-top: 1.5px solid var(--line); padding-top: 16px; }
.group h2 { font: 300 17px var(--ui); color: var(--live); margin: 0 0 4px; }
.lib { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); text-decoration: none; background: none; border: 0; padding: 2px 0; text-align: left; }
.lib i { width: 10px; height: 10px; flex: none; }
.lib span { margin-left: auto; color: var(--live); font-variant-numeric: tabular-nums; }
.lib[aria-pressed="true"] { font-weight: 600; }
.lastpost { margin-top: auto; display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; border-top: 1.5px solid var(--line); padding-top: 16px; }
.lastpost .th { width: 56px; height: 56px; background: var(--lime) url(shot-agent-asks.png) center/cover; }
.lastpost b { font-weight: 400; display: block; }
.lastpost small { color: var(--ink-3); font-size: 13px; }
.mflag { display: none; }
.flag { font: 400 11px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: #000; background: var(--orange); padding: 4px 7px; align-self: start; justify-self: start; }

main { min-width: 0; padding-block: 18px 80px; padding-right: max(32px, env(safe-area-inset-right, 0px)); overflow: hidden; }

/* Pivot header: the product name, giant and cropped, with the next one peeking in */
.pivot { position: relative; white-space: nowrap; overflow-x: clip; overflow-y: visible; margin-right: calc(-1 * max(32px, env(safe-area-inset-right, 0px))); }
.pivot-track { display: inline-flex; align-items: baseline; gap: .28em; font: 200 clamp(84px, 11.5vw, 184px)/1.08 var(--ui); letter-spacing: -.045em; }
@media (prefers-reduced-motion: no-preference) { .pivot-track { transition: transform .5s cubic-bezier(.16, 1, .3, 1); } }
.pivot-track button { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; color: #5e5e5e; }
.pivot-track button[aria-current="true"] { color: var(--ink); }
.pivot-track button:hover { color: #8a8a8a; } .pivot-track button[aria-current="true"]:hover { color: var(--ink); }
.status { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; margin: 14px 0 26px; font-size: 19px; color: var(--ink-2); }
.status b { font-weight: 400; color: var(--ink); }
.status .drop { background: none; border: 0; padding: 0; color: var(--ink-3); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #444; font-size: 15px; }

/* Today: tiles left, the open post right */
.today { display: grid; grid-template-columns: minmax(0, 600px) minmax(0, 1fr); gap: 36px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.left { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tile { position: relative; aspect-ratio: 1; border: 0; padding: 0; text-align: left; perspective: 900px; background: none; }
.tile.wide { grid-column: span 3; aspect-ratio: 1.75; }
.tile .flip { position: absolute; inset: 0; transform-style: preserve-3d; }
@media (prefers-reduced-motion: no-preference) {
  .tile .flip { animation: flip 9s cubic-bezier(.65, 0, .35, 1) infinite; animation-delay: var(--d, 0s); }
  .tile:active .flip { animation-play-state: paused; }
  .tile { transition: transform .12s; } .tile:active { transform: perspective(600px) rotateX(4deg) rotateY(-4deg) scale(.98); }
}
@keyframes flip { 0%, 42% { transform: rotateX(0) } 50%, 92% { transform: rotateX(180deg) } 100% { transform: rotateX(360deg) } }
.face { position: absolute; inset: 0; backface-visibility: hidden; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; color: #000; overflow: hidden; }
.face.back { transform: rotateX(180deg); }
.face h3 { margin: 0; font: 300 clamp(19px, 1.7vw, 25px)/1.05 var(--ui); letter-spacing: -.02em; text-wrap: balance; max-width: 12ch; }
.tile.wide .face h3 { font-size: clamp(40px, 4.4vw, 64px); line-height: .98; letter-spacing: -.03em; max-width: 9ch; }
.tile:not(.wide) .face { padding: 14px; }
.tile:not(.wide) .face .art { display: none; }
.tile:not(.wide) .face .meta { max-width: 100%; font-size: 12.5px; }
.tile:not(.wide) .face .meta svg { display: none; }
.face .meta { position: relative; z-index: 1; max-width: 52%; flex-wrap: wrap; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: 14px; font-weight: 400; }
.face .meta svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.face .art { position: absolute; right: -6%; bottom: -10%; width: 62%; aspect-ratio: 16/10; background-size: cover; background-position: center; box-shadow: -8px -8px 24px rgba(0,0,0,.22); }
.tile.wide .face .art { width: 52%; right: -4%; bottom: -12%; }
.tile.wide .face .meta { max-width: 50%; }
.face.back p { margin: 0; font: 300 clamp(17px, 1.5vw, 21px)/1.3 var(--ui); max-width: 24ch; }
.face.back small { font-size: 13px; font-weight: 400; opacity: .75; }
.tile:not(.wide) .dots::after { display: none; }
.dots::after { content: ""; position: absolute; right: 16px; top: 16px; width: 64px; height: 40px; background: radial-gradient(circle, rgba(0,0,0,.28) 1.1px, transparent 1.5px) 0 0/7px 7px; }
.tile[aria-pressed="true"]::after { content: ""; position: absolute; inset: -6px; border: 2px solid var(--ink); pointer-events: none; }
.tile.posted .face { filter: saturate(.25) brightness(.7); }
.tile .tag { position: absolute; z-index: 2; left: 20px; top: 50%; translate: 0 -50%; background: #000; color: var(--ink); padding: 5px 10px; font-size: 13px; font-weight: 400; }

/* The open post */
.open { display: grid; gap: 18px; min-width: 0; }
.open h2 { margin: 0; font: 300 clamp(30px, 2.8vw, 42px)/1.05 var(--ui); letter-spacing: -.02em; text-wrap: balance; }
.why { margin: -8px 0 0; color: var(--ink-2); max-width: 62ch; }
.warn { margin: 0; padding: 10px 14px; background: var(--orange); color: #000; font-weight: 400; }
.platforms { display: flex; gap: 22px; font-size: 22px; }
.platforms button { background: none; border: 0; padding: 0; color: #5a5a5a; font-weight: 300; }
.platforms button[aria-selected="true"] { color: var(--ink); }
.platforms button:hover { color: var(--ink-2); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 28px; min-height: 52px; padding: 0 18px; font: 300 20px var(--ui); background: var(--live); color: #000; border: 1.5px solid var(--live); text-decoration: none; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.ghost:hover { color: var(--live); border-color: var(--live); }
.btn.small { min-height: 40px; font-size: 16px; gap: 14px; }
.btn.done { background: var(--lime); border-color: var(--lime); }
.state { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; color: var(--ink-2); font-size: 15px; }
.state b { font-weight: 400; color: var(--ink); }
.pill { font: 400 12px/1 var(--ui); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; color: #000; }
.pill.draft { background: var(--orange); } .pill.ok { background: var(--lime); } .pill.fmt { background: #2a2a2a; color: var(--ink); }
.count { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.count.over { color: var(--magenta); }
.where { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.where span { color: var(--ink-2); }

/* Feed chrome: always light, because that is how the feeds look */
.feed { --f-fg: #0f1419; --f-muted: #536471; --f-line: #e6e8ea; background: #fff; color: var(--f-fg); padding: 14px; font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; display: grid; gap: 10px; max-width: 560px; }
.f-row { display: flex; gap: 10px; align-items: flex-start; }
.f-body { min-width: 0; flex: 1; display: grid; gap: 8px; }
.av { width: 40px; height: 40px; border-radius: 50%; background: #d24a22; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.f-ig .av { width: 32px; height: 32px; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #e1306c; }
.f-ig .f-row { align-items: center; }
.f-name span, .f-meta { color: var(--f-muted); font-size: 13px; }
.f-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; border-radius: 4px; outline: 0; }
.f-text[contenteditable="true"]:hover { background: #f3f6f8; }
.f-text[contenteditable="true"]:focus { background: #eef8fb; box-shadow: 0 0 0 2px var(--cyan); }
.more { background: none; border: 0; padding: 0; color: var(--f-muted); font: inherit; }
.f-actions { display: flex; gap: 18px; color: var(--f-muted); font-size: 13px; border-top: 1px solid var(--f-line); padding-top: 8px; }
.f-x .f-actions { border-top: 0; padding-top: 0; justify-content: space-between; max-width: 360px; }
.edit-hint { font-size: 13px; color: var(--ink-3); margin-top: -10px; }

/* Post visuals, in the product's own brand (Passalong here) */
.b-logo { display: inline-flex; align-items: center; gap: 1.6cqw; font: 600 3.2cqw/1 Inter, system-ui, sans-serif; color: #f3efe9; }
.b-logo b { width: 4.6cqw; height: 4.6cqw; border-radius: 1.2cqw; background: #d24a22; color: #fff; display: grid; place-items: center; font-size: 2.8cqw; }
.pa { --pa-ink: #f3efe9; --pa-acc: #f0764f; container-type: inline-size; position: relative; overflow: hidden; background: radial-gradient(120% 80% at 85% 0%, #40302a 0%, #1b1916 58%); color: var(--pa-ink); }
.pa .hl { font: 500 10.5cqw/1 Inter, system-ui, sans-serif; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.pa .hl em { font: italic 400 11.6cqw/.95 "Instrument Serif", Georgia, serif; color: var(--pa-acc); letter-spacing: 0; }
.pa .cap { font: 500 6.6cqw/1.08 Inter, system-ui, sans-serif; letter-spacing: -.025em; margin: 0; max-width: 90%; text-wrap: balance; }
.pa .num { font: 500 3.2cqw/1 Inter, sans-serif; color: var(--pa-acc); }
.pa .shot { position: absolute; background-size: cover; background-position: center top; border-radius: 2.4cqw; box-shadow: 0 4cqw 9cqw rgba(0,0,0,.5); }
.slide { flex: 0 0 100%; height: 100%; padding: 8% 8%; display: flex; flex-direction: column; gap: 3.5cqw; }
.slide .b-logo { margin-top: auto; }
.s-cover .hl { margin-top: 2cqw; font-size: 12cqw; } .s-cover .hl em { font-size: 13.4cqw; }
.s-cover .b-logo { margin-top: 0; order: -1; }
.s-cover .shot { left: 8%; right: -16%; bottom: -10%; height: 44%; }
.s-cover .sub { font: 400 4.6cqw/1.3 Inter, sans-serif; color: #cfc6bc; margin: 0; }
.s-shot .shot { left: 8%; right: -14%; bottom: -8%; height: 55%; }
.s-cta { background: #d24a22; }
.s-cta .hl em { color: #1b1916; }
.s-cta .url { margin-top: auto; align-self: flex-start; font: 500 4.4cqw Inter, sans-serif; background: #1b1916; color: #f3efe9; padding: 2.2cqw 4cqw; border-radius: 99px; }
.m-carousel { aspect-ratio: 4/5; }
.m-carousel .track { display: flex; height: 100%; }
@media (prefers-reduced-motion: no-preference) { .m-carousel .track { transition: transform .4s cubic-bezier(.16, 1, .3, 1); } }
.m-carousel .navb { position: absolute; top: 50%; translate: 0 -50%; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.95); color: #111; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.3); padding: 0; }
.m-carousel .navb svg { width: 12px; height: 12px; fill: currentColor; }
.navb.prev { left: 10px; } .navb.next { right: 10px; }
.counter { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.65); color: #fff; font: 12px Inter, sans-serif; padding: 3px 8px; border-radius: 99px; }
.dotsbar { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
.dotsbar i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); } .dotsbar i.on { background: #fff; }
.m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border-radius: 14px; overflow: hidden; }
.m-grid .slide { aspect-ratio: 1; height: auto; }
.m-image { aspect-ratio: 16/10; border-radius: 14px; padding: 6% 7%; }
.f-li .m-image, .f-ig .m-image { border-radius: 0; aspect-ratio: 4/5; }
.m-image .shot { left: 7%; right: -10%; bottom: -10%; height: 58%; }
.f-li .m-image .shot, .f-ig .m-image .shot { height: 50%; }
.m-image .b-logo { position: absolute; right: 7%; top: 7%; }
.m-clip { aspect-ratio: 16/9; border-radius: 14px; background: #1b1916; }
.f-ig .m-clip, .f-li .m-clip { border-radius: 0; aspect-ratio: 4/5; }
.clip-f { position: absolute; inset: 0; opacity: 0; padding: 6% 7% 16%; display: flex; flex-direction: column; justify-content: flex-start; gap: 3cqw; }
@media (prefers-reduced-motion: no-preference) {
  .clip-f { animation: clipfade 12.5s infinite; animation-delay: calc(var(--j) * 2.5s); }
  .clip-f .shot { animation: drift 12.5s infinite linear; animation-delay: calc(var(--j) * 2.5s); }
}
@media (prefers-reduced-motion: reduce) { .clip-f:first-child { opacity: 1; } }
.m-clip.paused .clip-f, .m-clip.paused .shot { animation-play-state: paused; }
@keyframes clipfade { 0% { opacity: 0 } 2% { opacity: 1 } 19% { opacity: 1 } 21% { opacity: 0 } 100% { opacity: 0 } }
@keyframes drift { 0% { transform: scale(1) } 20% { transform: scale(1.07) translateY(-1.5%) } 100% { transform: scale(1.07) } }
.clip-f .shot { left: 7%; right: -8%; top: 30%; bottom: -10%; }
.clip-f .time { font: 500 3.4cqw Inter, sans-serif; color: var(--pa-acc); }
.clip-f .cap { font-size: 5.6cqw; }
.f-code { position: absolute; left: 7%; right: 7%; top: 34%; margin: 0; font: 2.9cqw/1.6 ui-monospace, Menlo, monospace; background: #0d0c0b; color: #d8f3e4; padding: 4cqw; border-radius: 2cqw; white-space: pre; }
.clip-ui { position: absolute; top: 10px; display: flex; gap: 6px; z-index: 3; }
.clip-ui.l { left: 10px; } .clip-ui.r { right: 10px; }
.clip-ui span, .clip-ui button { font: 12px Inter, sans-serif; border-radius: 99px; padding: 3px 9px; background: rgba(0,0,0,.65); color: #fff; border: 0; }

/* Shared screen pieces */
.sect { display: grid; gap: 16px; margin-top: 40px; align-content: start; }
@media (prefers-reduced-motion: no-preference) { .tile, .ptile, .open { animation: rise .55s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 60ms); } }
@keyframes rise { from { transform: translateX(28px); } }
.sect h2 { margin: 0; font: 300 30px/1 var(--ui); color: var(--live); border-bottom: 1.5px solid var(--live); padding-bottom: 12px; }
.dropped { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.dropped li { display: grid; gap: 2px; }
.dropped s { color: var(--ink-3); font-size: 19px; }

.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.ptile { aspect-ratio: 1.3; padding: 18px 20px; color: #000; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.ptile h3 { margin: 0; font: 300 40px/1 var(--ui); letter-spacing: -.03em; }
.ptile svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.ptile p { align-items: center; margin: 0; font-size: 15px; font-weight: 400; display: flex; justify-content: space-between; gap: 8px; }
.ptile.add { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.ptile.add:hover { border-color: var(--live); color: var(--live); }
.ptile .need { background: #000; color: var(--ink); padding: 4px 8px; font-size: 13px; align-self: flex-start; }

.form { display: grid; gap: 18px; max-width: 760px; }
.field { display: grid; gap: 8px; font-size: 17px; }
.field small { color: var(--ink-3); font-size: 14px; }
.field input { font: 300 26px var(--ui); color: var(--ink); background: #000; border: 2px solid var(--ink-2); padding: 12px 14px; width: 100%; border-radius: 0; }
.field input:focus { border-color: var(--live); outline: 0; }
.field input::placeholder { color: #5a5a5a; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.note { color: var(--ink-2); margin: 0; max-width: 62ch; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; font-size: 22px; }
.steps li { display: flex; gap: 14px; align-items: center; color: var(--ink-3); }
.steps li::before { content: ""; width: 14px; height: 14px; border: 2px solid currentColor; flex: none; }
.steps li.done { color: var(--ink); } .steps li.done::before { background: var(--lime); border-color: var(--lime); }
.steps li.now { color: var(--live); }
@media (prefers-reduced-motion: no-preference) { .steps li.now::before { animation: pulse .8s ease-in-out infinite alternate; } }
@keyframes pulse { to { background: var(--live); } }

.know { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.editable { font: 300 21px/1.4 var(--ui); padding: 10px 12px; margin: 0 -12px; outline: 0; }
.editable:hover { background: var(--raise); } .editable:focus { box-shadow: inset 0 0 0 2px var(--live); }
.rules { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 17px; }
.rules li { display: flex; gap: 12px; align-items: baseline; }
.rules li em { font-style: normal; color: var(--ink-3); font-size: 14px; margin-left: auto; white-space: nowrap; }
.swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.swatches i { width: 48px; height: 48px; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.shotcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.shotcard .img { aspect-ratio: 16/10; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: var(--raise); }
.shotcard .img.blank { display: grid; place-items: center; color: var(--ink-3); border: 1.5px dashed #3a3a3a; }
.shotcard label { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.shotcard input { accent-color: var(--live); width: 18px; height: 18px; }
.addrule { display: flex; gap: 10px; align-items: center; }
.addrule input { flex: 1; min-width: 0; font: 300 17px var(--ui); color: var(--ink); background: #000; border: 2px solid #5a5a5a; padding: 10px 12px; border-radius: 0; }
.addrule input:focus { border-color: var(--live); outline: 0; }

.log { width: 100%; border-collapse: collapse; font-size: 17px; }
.log th { text-align: left; font: 300 15px var(--ui); color: var(--live); padding: 0 12px 10px 0; border-bottom: 1.5px solid var(--line); }
.log td { padding: 14px 12px 14px 0; border-bottom: 1px solid #1a1a1a; vertical-align: middle; }
.log td.when { color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.log .chip { display: inline-flex; align-items: center; gap: 8px; } .log .chip i { width: 12px; height: 12px; }
.tablewrap { overflow-x: auto; }

<script>
const PRODUCTS = [
  { id: 'passalong', name: 'passalong', url: 'passalong.dev', colour: 'var(--magenta)', ready: 4, week: 4, last: 'Today, Ada on X' },
  { id: 'squeeze', name: 'squeeze', url: 'saasqueeze.kreativekorna.com', colour: 'var(--cyan)', ready: 3, week: 2, last: 'Mon, you on X' },
  { id: 'fillie', name: 'fillie', url: 'fillie.kreativekorna.com', colour: 'var(--lime)', ready: 2, week: 1, last: 'Last Thu, Tunde on X', need: 'site changed, re-read it' },

const SHOTS = { work: 'shot-work-list.png', sorted: 'shot-sorted.png', asks: 'shot-agent-asks.png', docs: 'shot-project-docs.png' };

const POSTS = [
  { id: 'six-places', format: 'carousel', status: 'draft', tile: 'var(--magenta)', title: 'work arrives in six places', pattern: 'How it works, in 5 slides',
    why: 'Carousels get the most reach on LinkedIn and Instagram right now. One step per slide, each on the real product.',
    hook: 'Your team gets work from six places. Here’s how it all lands in one.',
    art: 'work',
    slides: [
      { kind: 'cover', shot: 'work', hl: 'Your team gets work from <em>six places.</em>', sub: 'Here’s how it all lands in one. Swipe.' },
      { kind: 'shot', shot: 'work', n: '01', cap: 'Everything comes in: the hub, email, your phone, alerts.' },
      { kind: 'shot', shot: 'sorted', n: '02', cap: 'Each one gets a clear title and goes to the right person.' },
      { kind: 'shot', shot: 'asks', n: '03', cap: 'An agent takes it, and asks when it needs an answer.' },
      { kind: 'cta', hl: 'Nothing gets <em>dropped.</em>', url: 'passalong.dev' },
    ],
    copy: {
      LinkedIn: `Your team gets work from six places. Most small teams drop some of it without noticing.

Here's how Passalong makes all of it land in one place, in 5 slides.

1. A line in the hub, a forwarded email, a screenshot from your phone, an alert. Each becomes work.
2. Passalong reads each one, gives it a title anyone can read and sends it to the right person or agent.
3. An agent takes it, reports as it goes, and asks when it needs an answer.
4. It hands in with evidence, and a person approves it.

Support and marketing need nothing installed. Developers connect Claude Code, Codex, ChatGPT or Claude.

passalong.dev`,
      Instagram: `Your team gets work from six places. Here's how it all lands in one. Swipe through.

Emails, bugs, alerts and screenshots go to the right person or agent the moment they arrive, and come back with evidence.

Link in bio.

#smallteams #aiagents #devtools #buildinpublic`,
      X: `Your team gets work from six places. Here's how Passalong makes it land in one:

passalong.dev`,
    } },
  { id: 'email-to-fix', format: 'clip', status: 'draft', tile: 'var(--cyan)', title: 'can’t log in, to fixed', pattern: 'Demo highlight',
    why: 'Short clips of the product doing one thing are the most shared launch format. Captions are burned in, so it works on mute.',
    flag: 'The times are an example. Swap in a real fix from this week before posting.',
    hook: 'A customer emails: “the reset link says expired”. 58 minutes later it’s fixed.',
    art: 'sorted',
    frames: [
      { shot: 'sorted', time: '09:12', cap: 'Kemi emails: she can’t log in. Passalong sorts it.' },
      { shot: 'work', time: '09:13', cap: 'It lands on the board, ready for an agent.' },
      { shot: 'asks', time: '09:40', cap: 'The agent finds the cause and asks Leo one question.' },

    copy: {
      X: `Kemi emails support: "the reset link says expired".

An agent finds the cause, asks one question, fixes it and shows its work. Leo approves it. Nobody copied anything between tools.

The whole path, in 12 seconds:`,
      LinkedIn: `A customer emails support: "I can't get into my account, the reset link says expired".

09:12 Passalong turns the email into work, with a title anyone can read.
09:40 An agent finds the cause: links expire after 60 seconds. It asks one question: keep old links working? Leo says yes, for an hour.
10:05 It hands in the command it ran and what came back.
10:10 Leo approves it.

Support never opened a terminal. Nothing was copied between tools.

passalong.dev`,
      Instagram: `Forward the email. Get back the fix.

Watch a "can't log in" go from a customer's inbox to fixed, in 12 seconds.

Link in bio.

#customersupport #aiagents #devtools`,
    } },
  { id: 'agent-asks', format: 'image', status: 'approved', approvedBy: 'Ada', tile: 'var(--lime)', title: 'agents ask. people decide.', pattern: 'One feature, one line',
    why: 'One idea, one close-up. Works on X, where people scroll fastest.',
    hook: 'Your agent hits a choice it shouldn’t make alone. It asks.',
    art: 'asks', shot: 'asks', hl: 'Agents ask. <em>People decide.</em>',
    copy: {
      X: `Your agent hits a choice it shouldn't make alone: keep old reset links working?

In Passalong it asks, waits for a person, and carries on once someone answers.

passalong.dev`,
      LinkedIn: `The risky moment with an AI agent isn't the code. It's the decision it makes without asking.

In Passalong, an agent that reaches a real choice asks, waits, and carries on once someone on the team answers. The question and the answer stay on the work, so the next agent reads them first.

passalong.dev`,
      Instagram: `Agents ask. People decide.

Link in bio.

#aiagents #devtools #buildinpublic`,

  { id: 'project-memory', format: 'image', status: 'draft', tile: 'var(--orange)', title: 'your product, written down', pattern: 'Show the mechanism',
    why: 'Shows the part of Passalong nobody else has: projects that remember the product for every agent.',
    hook: 'Every agent reads what your product is before it starts.',
    art: 'docs', shot: 'docs', hl: 'Agents that read <em>the brief first.</em>',
    copy: {
      LinkedIn: `Most AI agents start every job from zero. They don't know who uses your product, the words your team uses, or how it's built.

In Passalong, each product has a project: what it is, who uses it, the words you use and how it's built. Any agent reads it before it starts, and what it learns goes back in. Every version is kept.

passalong.dev`,
      X: `Agents that read the brief first.

Each product in Passalong has a project: what it is, who uses it, how it's built. Every agent reads it before it starts.

passalong.dev`,
      Instagram: `Agents that read the brief first.

#aiagents #devtools #buildinpublic`,

const FOLD = { LinkedIn: 210, Instagram: 125 };
const LIMITS = { X: 280, LinkedIn: 3000, Instagram: 2200 };
const FORMAT = { carousel: 'carousel · 5 slides', clip: 'clip · 0:12', image: 'close-up image' };
const DROPPED = [
  ['Boost your team’s productivity with AI', 'Generic. Names no feature; could be any product.'],
  ['Revolutionise how your agents collaborate', 'Uses a word Passalong’s voice bans. No evidence.'],
];
const POSTED = [
  ['Today 09:40', 'passalong', 'agents ask. people decide.', 'X', 'Ada'],
  ['Yesterday 18:02', 'sabipedia', 'did you know: jollof history', 'Instagram', 'You'],
  ['Yesterday 11:15', 'passalong', 'work arrives in six places', 'LinkedIn', 'Tunde'],
  ['Mon 16 Nov', 'squeeze', 'watch a file shrink in 3D', 'X', 'You'],
  ['Mon 16 Nov', 'sabipedia', 'how to renew a passport', 'LinkedIn', 'Ada'],
  ['Thu 12 Nov', 'fillie', 'one profile, ten forms', 'X', 'Tunde'],
];

const state = { product: 'passalong', sel: 'six-places', tab: {}, slide: {}, paused: {}, open: {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICON = {
  play: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>',
  prev: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M7 1L2 5l5 4z"/></svg>',
  slides: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h11v12H2zM15 5h1.5v10H15zM18 6h1v8h-1z"/></svg>',
  clip: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h16v12H2zM8 7v6l5-3z" fill-rule="evenodd"/></svg>',
  image: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h16v12H2zm2 10h12l-4-5-3 3.5-2-2z" fill-rule="evenodd"/></svg>',
};

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2000); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied. Paste it in, then mark it posted.'); } catch { toast('Copy is blocked here. Select the text instead.'); } }
const findPost = id => POSTS.find(p => p.id === id);
const shotBg = k => `background-image:url(${SHOTS[k]})`;
const LOGO = '<span class="b-logo"><b>P</b>Passalong</span>';

/* Post visuals */
function slideHTML(s) {
  if (s.kind === 'cover') return `<div class="slide pa s-cover">${LOGO}<p class="hl">${s.hl}</p><p class="sub">${s.sub}</p><div class="shot" style="${shotBg(s.shot)}"></div></div>`;
  if (s.kind === 'cta') return `<div class="slide pa s-cta"><p class="hl">${s.hl}</p><span class="url">${s.url}</span></div>`;
  return `<div class="slide pa s-shot"><span class="num">${s.n}</span><p class="cap">${s.cap}</p><div class="shot" style="${shotBg(s.shot)}"></div></div>`;
}
function media(p, platform) {
  const i = state.slide[p.id] || 0;
  if (p.format === 'carousel') {
    if (platform === 'X') return `<div class="m-grid">${p.slides.slice(0, 4).map(slideHTML).join('')}</div>`;
    return `<div class="m-carousel pa"><div class="track" style="transform:translateX(-${i * 100}%)">${p.slides.map(slideHTML).join('')}</div>
      ${i > 0 ? `<button class="navb prev" data-act="slide" data-id="${p.id}" data-d="-1" aria-label="Previous slide">${ICON.prev}</button>` : ''}
      ${i < p.slides.length - 1 ? `<button class="navb next" data-act="slide" data-id="${p.id}" data-d="1" aria-label="Next slide">${ICON.play}</button>` : ''}
      ${platform === 'LinkedIn' ? `<span class="counter">${i + 1} / ${p.slides.length}</span>` : `<div class="dotsbar">${p.slides.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>`}</div>`;
  }
  if (p.format === 'clip') return `<div class="m-clip pa ${state.paused[p.id] ? 'paused' : ''}">${p.frames.map((f, j) => `<div class="clip-f" style="--j:${j}"><span class="time">${f.time}</span><p class="cap">${f.cap}</p>${f.code ? `<pre class="f-code">$ pnpm test auth
✓ reset link valid for 60 min
✓ 31 passed (2.4s)
$ curl -s /reset?t=old | head -1
200 OK</pre>` : `<div class="shot" style="${shotBg(f.shot)}"></div>`}</div>`).join('')}
    <div class="clip-ui l"><button data-act="play" data-id="${p.id}">${state.paused[p.id] ? 'Play' : 'Pause'}</button></div><div class="clip-ui r"><span>Captions on</span><span>0:12</span></div></div>`;
  return `<div class="m-image pa"><p class="hl" style="font-size:8cqw">${p.hl}</p>${LOGO}<div class="shot" style="${shotBg(p.shot)}"></div></div>`;
}
function feed(p, platform) {
  const text = p.copy[platform], fold = FOLD[platform], k = p.id + platform, open = state.open[k];
  const cut = fold && !open && text.length > fold;
  const body = cut ? `<p class="f-text">${esc(text.slice(0, fold).replace(/\s+\S*$/, ''))}<button class="more" data-act="more-text" data-k="${k}" data-id="${p.id}">…${platform === 'LinkedIn' ? 'see more' : 'more'}</button></p>`
    : `<p class="f-text" contenteditable="true" spellcheck="true" data-act="edit" data-id="${p.id}" data-tab="${platform}" aria-label="Post text, editable">${esc(text)}</p>`;
  const av = '<span class="av" aria-hidden="true">P</span>';
  if (platform === 'X') return `<div class="feed f-x"><div class="f-row">${av}<div class="f-body"><div class="f-name"><b>Passalong</b> <span>@passalongdev · now</span></div>${body}${media(p, platform)}<div class="f-actions"><span>Reply</span><span>Repost</span><span>Like</span><span>Views</span></div></div></div></div>`;
  if (platform === 'LinkedIn') return `<div class="feed f-li"><div class="f-row">${av}<div><b>Passalong</b><div class="f-meta">1,204 followers · Now</div></div></div>${body}${media(p, platform)}<div class="f-actions"><span>Like</span><span>Comment</span><span>Repost</span><span>Send</span></div></div>`;
  return `<div class="feed f-ig"><div class="f-row">${av}<b>passalong.dev</b></div>${media(p, platform)}<div class="f-actions"><span>Like</span><span>Comment</span><span>Share</span><span style="margin-left:auto">Save</span></div>${cut ? body.replace('<p class="f-text">', '<p class="f-text"><b>passalong.dev</b> ') : body}</div>`;
}

/* Tiles */
function tile(p, i) {
  const wide = i === 0, sel = state.sel === p.id;
  return `<button class="tile ${wide ? 'wide' : ''} ${p.posted ? 'posted' : ''}" data-act="select" data-id="${p.id}" aria-pressed="${sel}" style="--d:${1.5 + i * 2.2}s;--i:${i}" aria-label="${esc(p.title)}, ${FORMAT[p.format]}">
    <span class="flip">
      <span class="face front dots" style="background:${p.tile}"><h3>${esc(p.title)}</h3><span class="art" style="${shotBg(p.art)}"></span><span class="meta"><span>${FORMAT[p.format]}</span>${ICON[p.format === 'carousel' ? 'slides' : p.format]}</span></span>
      <span class="face back" style="background:${p.tile}"><p>“${esc(p.hook)}”</p><small>first line · ${Object.keys(p.copy).join(', ')}</small></span>
    </span>
    ${p.posted ? `<span class="tag">posted on ${p.posted.where}</span>` : ''}
  </button>`;
}

function stateLine(p) {
  if (p.posted) return `<span class="pill ok">Posted</span><span>by <b>you</b> on <b>${p.posted.where}</b> · the team can see it</span>`;
  if (p.status === 'approved') return `<span class="pill ok">Approved</span><span>by <b>${p.approvedBy}</b> · anyone can post it</span>`;
  return `<span class="pill draft">Draft</span><span>needs one person to approve it</span>`;
}

function openPost(p) {
  const platforms = Object.keys(p.copy), platform = state.tab[p.id] || platforms[0];
  const n = p.copy[platform].length, lim = LIMITS[platform], fold = FOLD[platform];
  const mediaLabel = p.format === 'carousel' ? 'copy 5 slides' : p.format === 'clip' ? 'copy clip' : 'copy image';
  const step = p.posted ? `<button class="btn small ghost" data-act="unpost" data-id="${p.id}">undo posted</button>`
    : p.status === 'approved' ? `<button class="btn small ghost" data-act="mark" data-id="${p.id}">mark posted</button>`
    : `<button class="btn small ghost" data-act="approve" data-id="${p.id}">approve</button><button class="btn small ghost" data-act="assign">ask Ada</button>`;
  return `<section class="open" id="open" aria-live="polite">
    <h2>${esc(p.title)}</h2>
    <p class="why"><b style="font-weight:400;color:var(--ink)">${p.pattern}.</b> ${p.why}</p>
    ${p.flag ? `<p class="warn">${p.flag}</p>` : ''}
    <div class="platforms" role="tablist" aria-label="Platform">${platforms.map(t => `<button role="tab" aria-selected="${t === platform}" data-act="tab" data-id="${p.id}" data-tab="${t}">${t.toLowerCase()}</button>`).join('')}</div>
    <div class="actions"><button class="btn" data-act="copy" data-id="${p.id}">copy ${platform.toLowerCase()} text ${ICON.play}</button><button class="btn ghost" data-act="copymedia" data-id="${p.id}">${mediaLabel} ${ICON.play}</button></div>
    <div class="state">${stateLine(p)}</div>
    <div class="actions" id="steps">${step}</div>
    <span class="count ${n > lim ? 'over' : ''}" id="count">${n} / ${lim.toLocaleString()} characters${fold ? ` · first ${fold} show before “more”` : ''}</span>
    ${feed(p, platform)}
    <p class="edit-hint">Click the post text to edit it. Open “see more” first on LinkedIn and Instagram.</p>
  </section>`;
}

/* Rail library */
function renderLib() {
  $('#lib').innerHTML = `<h2>my products</h2>${PRODUCTS.map(p => `<button class="lib" data-act="pivot" data-id="${p.id}" aria-pressed="${state.product === p.id}"><i style="background:${p.colour}"></i>${p.name}<span>${p.ready}</span></button>`).join('')}`;
}

function pivotHeader(idx) {
  return `<div class="pivot"><div class="pivot-track" id="pivot" style="transform:translateX(-${idx ? 'var(--shift)' : '0px'})">${PRODUCTS.map(p => `<button data-act="pivot" data-id="${p.id}" aria-current="${state.product === p.id}">${p.name}</button>`).join('')}</div></div>`;
}

const views = {
  today() {
    const pi = PRODUCTS.findIndex(p => p.id === state.product), prod = PRODUCTS[pi];
    if (state.product !== 'passalong') return `${pivotHeader(pi)}
      <p class="status"><b>${prod.ready} ready today</b><span>${prod.url}</span></p>
      <div class="ptiles" style="max-width:760px"><div class="ptile" style="background:${prod.colour}"><h3>only passalong is filled in for this mock</h3><p><span>pick passalong to see today's posts</span></p></div>
      <button class="ptile add" data-act="pivot" data-id="passalong"><h3>back to passalong</h3><p><span>4 ready today</span>${ICON.play}</p></button></div>`;
    const p = findPost(state.sel), ready = POSTS.filter(x => !x.posted).length;
    return `${pivotHeader(pi)}
      <p class="status"><b>${ready} ready today</b><span>best first</span><span>Wed 18 Nov</span><button class="drop" data-act="jump-dropped">2 dropped by the quality check</button></p>

        <section class="sect" id="dropped"><h2>dropped by the quality check</h2>
          <ul class="dropped">${DROPPED.map(([t, why]) => `<li><s>${esc(t)}</s><span>${esc(why)}</span></li>`).join('')}</ul>

        ${openPost(p)}

  },
  products() {
    return `<div class="pivot"><div class="pivot-track"><button aria-current="true" tabindex="-1">products</button><button tabindex="-1">posted</button></div></div>
      <p class="status"><b>5 products</b><span>12 posts ready today</span></p>
      <div class="ptiles">
        ${PRODUCTS.map(p => `<a class="ptile dots" href="#today" data-act="pivot" data-id="${p.id}" style="background:${p.colour}"><h3>${p.name}</h3>${p.need ? `<span class="need">${p.need}</span>` : ''}<p><span>${p.ready} ready · ${p.week} posted this week</span>${ICON.play}</p></a>`).join('')}
        <a class="ptile add" href="#add"><h3>add a product</h3><p><span>paste its link</span>${ICON.play}</p></a>
      </div>
      <section class="sect"><h2>passalong, what it knows</h2><p class="note">What it does, its voice rules and the screens it took. <a href="#knows" style="color:var(--live)">open it</a></p></section>`;
  },
  add() {
    return `<div class="pivot"><div class="pivot-track"><button aria-current="true" tabindex="-1">add a product</button></div></div>
      <p class="status"><span>Paste the live app’s link. It opens it like a new user, learns what it does and cuts out the screens worth showing. About two minutes.</span></p>
      <form class="form" id="addform">
        <label class="field" for="url">link to the app<input id="url" value="https://passalong.dev" inputmode="url" autocomplete="off"></label>
        <div class="two">
          <label class="field" for="demo-user">demo login <small>optional</small><input id="demo-user" placeholder="demo@yourapp.com" autocomplete="off"></label>
          <label class="field" for="demo-pass">demo password <small>optional</small><input id="demo-pass" type="password" placeholder="demo account only" autocomplete="off"></label>
        </div>
        <p class="note">With a demo login it can show the real product: dashboards and screens behind sign-in. Use a demo account with example data, never a real one.</p>
        <div class="actions"><button class="btn" type="submit">read the product ${ICON.play}</button><a class="btn ghost" href="#add" data-act="repo">add from a repo instead ${ICON.play}</a></div>
      </form>
      <section class="sect" id="progress" hidden><h2>reading passalong.dev</h2><ol class="steps" id="steps-list"></ol>
        <div class="actions" id="progress-done" hidden><a class="btn" href="#knows">see what it learned ${ICON.play}</a><a class="btn ghost" href="#today">today's posts ${ICON.play}</a></div></section>`;
  },
  knows() {
    const shots = [['work', 'work list', true], ['sorted', 'email sorted', true], ['asks', 'agent asks', true], ['docs', 'project documents', true], [null, 'hub board · needs a demo login', false], [null, 'hand-in with evidence · needs a demo login', false]];
    return `<div class="pivot"><div class="pivot-track"><button aria-current="true" tabindex="-1">passalong</button><button tabindex="-1">what it knows</button></div></div>
      <p class="status"><span>Learned from passalong.dev on 18 November. Anyone on the team can correct it, and every post after uses the correction.</span></p>
      <div class="know">
        <section class="sect" style="margin-top:0"><h2>what it does</h2>
          <p class="editable" contenteditable="true">Sorts everything a team gets (emails, bug reports, alerts, screenshots) to the right person or AI agent as it arrives, and follows it until it is done with evidence a person can check.</p>
          <h2>who it is for</h2>
          <p class="editable" contenteditable="true">Leads of small teams, developers running AI coding agents, and support or marketing people who never open a terminal.</p>
          <h2>brand</h2>
          <div class="swatches"><i style="background:#1b1916"></i><i style="background:#d24a22"></i><i style="background:#f0764f"></i><i style="background:#f3efe9"></i><span class="count" style="margin-left:8px">Inter and Instrument Serif italic, taken from the site</span></div>
        </section>
        <section class="sect" style="margin-top:0"><h2>voice rules</h2>
          <ul class="rules" id="rules">
            <li>Plain, exact, calm. Say what it does, not how it feels.<em>learned</em></li>
            <li>British spelling. Sentence case.<em>learned</em></li>
            <li>Name only Claude Code, Codex, ChatGPT and Claude.<em>added by you</em></li>
            <li>Never state a price.<em>added by Ada</em></li>
            <li>Never: seamless, powerful, revolutionise, exclamation marks.<em>learned</em></li>
          </ul>
          <form class="addrule" id="ruleform"><label for="newrule" class="count" style="position:absolute;left:-9999px">New rule</label><input id="newrule" placeholder="say ‘work’, never ‘ticket’"><button class="btn small" type="submit">add rule</button></form>
        </section>
      </div>
      <section class="sect"><h2>screens it cut out</h2>
        <div class="shots">${shots.map(([k, name, on], i) => `<div class="shotcard"><div class="img ${k ? '' : 'blank'}" style="${k ? shotBg(k) : ''}">${k ? '' : 'sign-in needed'}</div><label for="shot-${i}"><input type="checkbox" id="shot-${i}" ${on ? 'checked' : ''} ${k ? '' : 'disabled'}>${name}</label></div>`).join('')}</div>
      </section>
      <section class="sect"><h2>angles already used</h2><p class="note">Feature spotlight twice, problem and fix once, launch post once. Next up: comparisons, tips, customer-style stories.</p></section>`;
  },
  posted() {
    const colour = n => (PRODUCTS.find(p => p.name === n) || {}).colour;
    return `<div class="pivot"><div class="pivot-track"><button aria-current="true" tabindex="-1">posted</button><button tabindex="-1">products</button></div></div>
      <p class="status"><b>${POSTED.length} posts</b><span>last 7 days</span><span>it won’t repeat an angle on the same platform within 30 days</span></p>
      <div class="tablewrap"><table class="log">
        <thead><tr><th>when</th><th>product</th><th>post</th><th>where</th><th>who</th></tr></thead>
        <tbody>${POSTED.map(r => `<tr><td class="when">${r[0]}</td><td><span class="chip"><i style="background:${colour(r[1])}"></i>${r[1]}</span></td><td>${esc(r[2])}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody>
      </table></div>`;
  },
};

function shiftPivot() {
  const track = $('#pivot'); if (!track) return;
  const cur = track.querySelector('[aria-current="true"]');
  track.style.transform = `translateX(-${cur.offsetLeft}px)`;
}

function render() {
  const route = (location.hash || '#today').slice(1);
  const view = views[route] ? route : 'today';
  $('#view').innerHTML = views[view]();
  document.querySelectorAll('.nav a').forEach(a => a.getAttribute('href') === '#' + view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  renderLib(); shiftPivot();
}
function redrawOpen() { const p = findPost(state.sel); $('#open').outerHTML = openPost(p); }
function redrawTiles() { const g = document.querySelector('.tiles'); if (g) g.innerHTML = POSTS.map(tile).join(''); }

document.addEventListener('input', e => {
  const t = e.target.closest('[data-act="edit"]'); if (!t) return;
  const p = findPost(t.dataset.id); p.copy[t.dataset.tab] = t.innerText;
  const lim = LIMITS[t.dataset.tab], fold = FOLD[t.dataset.tab], n = t.innerText.length, c = $('#count');
  c.textContent = `${n} / ${lim.toLocaleString()} characters${fold ? ` · first ${fold} show before “more”` : ''}`;
  c.classList.toggle('over', n > lim);
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.dataset.act === 'edit') return;
  const p = b.dataset.id && findPost(b.dataset.id);
  switch (b.dataset.act) {
    case 'select': state.sel = p.id; redrawTiles(); redrawOpen(); if (innerWidth < 1180) $('#open').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'pivot': e.preventDefault(); state.product = b.dataset.id; if (location.hash && location.hash !== '#today') location.hash = '#today'; else render(); break;
    case 'tab': state.tab[p.id] = b.dataset.tab; redrawOpen(); break;
    case 'slide': state.slide[p.id] = Math.max(0, Math.min(p.slides.length - 1, (state.slide[p.id] || 0) + +b.dataset.d)); redrawOpen(); break;
    case 'play': state.paused[p.id] = !state.paused[p.id]; redrawOpen(); break;
    case 'more-text': state.open[b.dataset.k] = true; redrawOpen(); break;
    case 'copy': copy(p.copy[state.tab[p.id] || Object.keys(p.copy)[0]]); break;
    case 'copymedia': toast(p.format === 'carousel' ? 'In the real app: the 5 slides as a PDF, ready for LinkedIn.' : p.format === 'clip' ? 'In the real app: a 12-second MP4 sized for this platform.' : 'In the real app: the image sized for this platform.'); break;
    case 'assign': toast('Ada gets a note to approve it.'); break;
    case 'repo': e.preventDefault(); toast('In the real app: a CLI for developers that runs the app locally.'); break;
    case 'jump-dropped': $('#dropped').scrollIntoView({ behavior: 'smooth' }); break;
    case 'approve': p.status = 'approved'; p.approvedBy = 'you'; redrawOpen(); toast('Approved. Anyone on the team can post it now.'); break;
    case 'unpost': delete p.posted; redrawTiles(); redrawOpen(); break;
    case 'mark': {
      if ($('#where')) { $('#where').remove(); break; }
      const cur = state.tab[p.id] || Object.keys(p.copy)[0];
      $('#steps').insertAdjacentHTML('afterend', `<div class="popover" id="where"><span>Where did you post it?</span><div class="actions">${Object.keys(p.copy).map(t => `<button class="btn small ${t === cur ? '' : 'ghost'}" data-act="where" data-id="${p.id}" data-where="${t}">${t.toLowerCase()}</button>`).join('')}</div></div>`);
      break;
    }
    case 'where': p.posted = { where: b.dataset.where }; POSTED.unshift(['Just now', 'passalong', p.title, b.dataset.where, 'You']); redrawTiles(); redrawOpen(); toast('Marked posted. The team can see it.'); break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'ruleform') {
    const v = $('#newrule').value.trim(); if (!v) return;
    $('#rules').insertAdjacentHTML('beforeend', `<li>${esc(v)}<em>added by you</em></li>`);
    $('#newrule').value = ''; toast('Rule added. Every post from now on uses it.');
  }
  if (e.target.id === 'addform') {
    e.target.hidden = true; $('#progress').hidden = false;
    const steps = ['opened passalong.dev', 'read 14 pages: landing, docs, FAQ, guides', 'no demo login, so it stayed on public pages', 'cut out 4 illustrations and 2 screens', 'learned the voice from the site’s own words', 'took its colours and fonts', 'wrote today’s 4 posts and dropped 2 weak ones'];
    const ol = $('#steps-list'); ol.innerHTML = steps.map(s => `<li>${s}</li>`).join('');
    const lis = [...ol.children]; let k = 0;
    const tick = () => { lis.forEach((li, j) => { li.className = j < k ? 'done' : j === k ? 'now' : ''; }); if (k++ < lis.length) setTimeout(tick, 520); else $('#progress-done').hidden = false; };
    tick();
  }
});

addEventListener('hashchange', render);
addEventListener('resize', shiftPivot);
render();
</script>
