<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post maker</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #000; color: #8a8a8a; -webkit-user-select: none; user-select: none; cursor: default; font: 300 15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .tile { width: 56px; height: 56px; background: #00bde3; margin: 0 auto 18px; display: grid; place-items: end start; padding: 6px 8px; box-sizing: border-box; color: #000; font: 300 22px/1 -apple-system, system-ui, sans-serif; }
  p { text-align: center; max-width: 46ch; line-height: 1.5; }
</style>
</head>
<body>
  <div><div class="tile">p</div><p id="msg"></p></div>
  <script>
    // Opens the Post maker web app once it answers. The local engine starts on its own beside it.
    (async function wait(tries = 0) {
      const url = await window.__TAURI__.core.invoke('app_url').catch(() => 'http://localhost:3417')
      const up = await fetch(url, { mode: 'no-cors', cache: 'no-store' }).then(() => true, () => false)
      if (up) { location.replace(url); return }
      const msg = document.getElementById('msg')
      if (tries === 4) msg.textContent = 'Opening Post maker…'
      if (tries === 20) msg.textContent = `Post maker isn’t answering at ${url}. Check your connection; it keeps trying.`
      setTimeout(() => wait(tries + 1), 1000)
    })()
  </script>
</body>
</html>
