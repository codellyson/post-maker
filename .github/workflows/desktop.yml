# Push a version tag (git tag v0.3.0 && git push origin v0.3.0) to build the macOS desktop app
# against the live site and publish it as a GitHub release. The release also carries the signed update
# and latest.json, which installed apps check on launch to offer the new version.
#
# Secret (repo → Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  contents of ~/.tauri/post-maker.key on the owner's Mac (no password)
# The app is ad-hoc signed ("-"), not notarised: the first time, right-click it and choose Open.
name: desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # The repo's packageManager is pnpm, but this job only needs npm (stage-engine.sh, npx); skip the pnpm cache lookup.
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # The app's version comes from the tag, so the updater can tell releases apart.
      # Run from the repo root: beforeBuildCommand is `sh desktop/stage-engine.sh`.
      - name: Build Post maker.app
        env:
          PM_APP_URL: https://postmaker.kreativekorna.com
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          npx --yes @tauri-apps/cli@2.11.2 build --bundles app --config "{\"version\":\"$version\"}"
      - name: Package
        run: |
          out="$RUNNER_TEMP/release" && mkdir -p "$out"
          dir="desktop/target/release/bundle/macos"
          ditto -c -k --keepParent "$dir/Post maker.app" "$out/Post-maker-mac.zip"
          cp "$dir/Post maker.app.tar.gz" "$out/Post-maker.app.tar.gz"
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const [version, tag, sig] = process.argv.slice(1)
            const url = `https://github.com/codellyson/post-maker/releases/download/${tag}/Post-maker.app.tar.gz`
            const json = { version, notes: `Post maker ${tag}`, pub_date: new Date().toISOString(), platforms: { "darwin-aarch64": { signature: sig, url } } }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/release/latest.json", JSON.stringify(json, null, 2))
          ' "$version" "$GITHUB_REF_NAME" "$(cat "$dir/Post maker.app.tar.gz.sig")"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --title "Post maker $GITHUB_REF_NAME" \
            --notes "macOS (Apple silicon). Download Post-maker-mac.zip. Ad-hoc signed: the first time, right-click the app and choose Open. Installed copies offer this version on their next launch."
