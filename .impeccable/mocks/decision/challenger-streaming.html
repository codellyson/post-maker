<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#121417;color:#f5f5f5;font:14px/1.45 Inter,sans-serif}
header{display:flex;gap:24px;align-items:center;padding:22px 48px}header b{font:800 22px Inter;color:#ff5a36}header span{color:#aaa}
.hero{height:380px;margin:0 48px;border-radius:12px;background:radial-gradient(120% 80% at 80% 0,#3a2a22,#1b1916 60%);padding:40px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.hero h1{font:800 54px/1 Inter;letter-spacing:-.03em;max-width:700px}
.hero p{color:#ddd;max-width:620px}
.btns{display:flex;gap:10px}.btns span{padding:12px 22px;border-radius:6px;background:#fff;color:#111;font-weight:600}.btns .g{background:rgba(255,255,255,.18);color:#fff}
.row{padding:22px 48px 0}.row h2{font:600 18px Inter;margin-bottom:10px}
.cards{display:flex;gap:10px}.c{width:250px;height:150px;border-radius:8px;flex:none}
.f{outline:3px solid #ff5a36;transform:scale(1.06)}
.dim{opacity:.45}
</style></head><body>
<header><b>Post maker</b><span>Today</span><span>Products</span><span>Posted</span></header>
<div class="hero"><p>Today's top pick · Passalong · carousel</p><h1>Work arrives in six places</h1><p>Your team gets work from six places. Here's how it all lands in one.</p><div class="btns"><span>Copy text</span><span class="g">Copy slides</span><span class="g">Preview on LinkedIn</span></div></div>
<div class="row"><h2>Today for Passalong</h2><div class="cards"><div class="c f" style="background:#f08463"></div><div class="c" style="background:#fbe6dd"></div><div class="c" style="background:#f1f0ee"></div><div class="c" style="background:#2b2926"></div><div class="c" style="background:#3a2a22"></div></div></div>
<div class="row dim"><h2>Today for Squeeze</h2><div class="cards"><div class="c" style="background:#4a90c8"></div><div class="c" style="background:#2d5d86"></div><div class="c" style="background:#9cc6e8"></div><div class="c" style="background:#1f3c58"></div><div class="c" style="background:#4a90c8"></div></div></div>
</body></html>
